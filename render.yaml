services:
  # Backend API Service
  - type: web
    name: smartfridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfridge-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SIMULATION_MODE
        value: true

  # Frontend Static Web App (Alternative to Vercel/Netlify)
  - type: web
    name: smartfridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartfridge-backend
          envVarKey: RENDER_EXTERNAL_URL
          # Appends /api/v1 automatically in code if not present

databases:
  # Free PostgreSQL Database on Render
  - name: smartfridge-db
    databaseName: smartfridge_db
    user: smartfridge_user
    plan: free
